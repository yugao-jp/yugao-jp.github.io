<!doctype html>
<html lang="ja">

  <title>Project Yugao 公式サイト準備中</title>
  <style>

  </style>
</head>
<body>
  <main>
    <div class="rabbit" role="img" aria-label="うさちゃん">🐰</div>
    <h1>Project Yugao 公式サイト準備中</h1>
    <p>夕顔うさちゃんが、もうすぐお迎えします。</p>
    <p><a href="https://yugao.jp">yugao.jp</a></p>

</html>
